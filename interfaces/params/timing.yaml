        max: 120
        owner: [APP]
        stage: A
        cal: false
        desc: WindowMove period while a press is held
        refs: [SM-01]
      t_app_send_max_ms:
        value: 20
        unit: ms
        owner: [APP]
        stage: A
        cal: false
        desc: "APP allocation: pointer event → frame handed to the socket"
      t_app_render_max_ms:
        value: 16
        unit: ms
        owner: [APP]
        stage: A
        cal: false
        desc: "APP allocation: frame received → displayed"
      t_app_press_gap_min_ms:
        value: 200
        unit: ms
        owner: [APP]
        stage: A
        cal: false
        desc: Minimum time between the end of a press and the next press
      t_cgw_tick_ms:
