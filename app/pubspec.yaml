name: locksys_app
description: >-
  LockSys smartphone APP: door lock and hold-to-run window control through the CGW SoftAP
  (LS-APP-SAD-001).
publish_to: none
# Set from the repository SemVer by the release tooling.
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.6"

dependencies:
  bloc: ^9.2.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  intl: any
  locksys_netbind:
    path: packages/locksys_netbind
  locksys_protocol:
    path: packages/locksys_protocol
  logging: ^1.3.0
  meta: ^1.18.0

dev_dependencies:
  bloc_test: ^10.0.0
  clock: ^1.1.3
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5
  protobuf: 6.1.0
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true
