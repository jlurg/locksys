name: locksys_netbind
description: >-
  Joins the LockSys gateway SoftAP (WPA3-SAE, exact SSID and BSSID), binds the process to it and
  probes local-network access. Platform channels are generated by pigeon.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.6"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  pigeon: 29.0.6
  very_good_analysis: ^11.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.github.jlurg.locksys.netbind
        pluginClass: NetbindPlugin
      ios:
        pluginClass: NetbindPlugin
