name: locksys_protocol
description: >-
  LockSys APP <-> CGW protocol 1.0 (LS-SAIC-001 section 8): generated protobuf messages and
  parameters, frame codec, session crypto (HMAC-SHA256, HKDF-SHA256) and close-code policy.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  crypto: ^3.0.7
  # Exact pin: the committed code is generated by protoc_plugin 25.1.0 for this runtime.
  protobuf: 6.1.0

dev_dependencies:
  coverage: ^1.15.1
  test: ^1.32.0
  very_good_analysis: ^11.0.0
