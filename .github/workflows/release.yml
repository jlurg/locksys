#
# Release publication for signed tags vX.Y.Z and vX.Y.Z-rc.N (docs/08_process/release_process.md).
# verify -> assemble -> publish (environment "release", draft first, then published, which
# makes the release immutable). No caches are used in this workflow.
# Component artefacts (DCU, CGW, APP, HIL acceptance) are added to the assemble stage at M6;
# until then the release manifest lists them as pending.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Checks that must have succeeded on the release head (second parent) of a final tag.
  RELEASE_GATES: iar-gate hil-gate

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tag name and VERSION
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-rc\.[0-9]+)?$ ]]; then
            echo "::error::tag '$TAG' is not vX.Y.Z or vX.Y.Z-rc.N"
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          prerelease=false
          if [ -n "${BASH_REMATCH[2]}" ]; then
            prerelease=true
          fi
          file_version=$(tr -d '[:space:]' < VERSION)
          if [ "$file_version" != "$version" ]; then
            echo "::error::VERSION is '$file_version' but the tag is '$TAG'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: Annotated tag with a verified signature by a trusted maintainer
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TRUSTED_ACTORS: ${{ vars.TRUSTED_ACTORS }}
        run: |
          read -r type sha < <(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')
          if [ "$type" != tag ]; then
            echo "::error::'$TAG' is a lightweight tag; release tags are annotated and signed"
            exit 1
          fi
          tag_json=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha")
          verified=$(jq -r '.verification.verified' <<<"$tag_json")
          reason=$(jq -r '.verification.reason' <<<"$tag_json")
          email=$(jq -r '.tagger.email' <<<"$tag_json")
          if [ "$verified" != true ]; then
            echo "::error::tag signature is not verified by GitHub (reason: $reason)"
            exit 1
          fi
          login=$(sed -nE 's/^[0-9]+\+([^@]+)@users\.noreply\.github\.com$/\1/p' <<<"$email")
          if [ -z "$login" ] || ! jq -e --arg login "$login" 'index($login) != null' <<<"${TRUSTED_ACTORS:-[]}" > /dev/null; then
            echo "::error::tagger '$email' is not a trusted maintainer identity"
            exit 1
          fi
          echo "Tag $TAG signed by $login (verified)"
      - name: Release-line preconditions
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = true ]; then
            if ! git branch --remotes --contains "$GITHUB_SHA" | grep -qE 'origin/(release|hotfix)/'; then
              echo "::error::release candidates are tagged on a release/* or hotfix/* head"
              exit 1
            fi
            exit 0
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::final release tags are on main"
            exit 1
          fi
          read -r -a parents < <(git rev-list --parents -n 1 "$GITHUB_SHA")
          if [ "${#parents[@]}" -ne 3 ]; then
            echo "::error::the tagged commit is not a merge commit"
            exit 1
          fi
          head="${parents[2]}"
          if [ "$(git rev-parse "$GITHUB_SHA^{tree}")" != "$(git rev-parse "$head^{tree}")" ]; then
            echo "::error::the merge commit tree differs from the release head $head"
            exit 1
          fi
          for gate in $RELEASE_GATES; do
            passed=$(gh api "repos/$GITHUB_REPOSITORY/commits/$head/check-runs?check_name=$gate&status=completed" \
              --jq '[.check_runs[] | select(.conclusion == "success")] | length')
            if [ "$passed" -lt 1 ]; then
              echo "::error::$gate has not succeeded on the release head $head"
              exit 1
            fi
          done

  assemble:
    name: assemble
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Load the uv pin
        run: grep -E '^UV=' tools/versions.env >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV }}
          enable-cache: false
      - name: Source and documentation archives
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="locksys-${VERSION}/" -o "dist/locksys-${TAG}-src.tar.gz" "$TAG"
          git archive --format=zip --prefix="docs-${TAG}/" -o "dist/docs-${TAG}.zip" "$TAG" docs
      - name: Build environment and release manifest
        env:
          TAG: ${{ github.ref_name }}
          RUNNER_IMAGE: ${{ runner.os }}-${{ runner.arch }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import platform
          from pathlib import Path

          pins = {}
          for line in Path("tools/versions.env").read_text(encoding="utf-8").splitlines():
              line = line.strip()
              if line and not line.startswith("#") and "=" in line:
                  key, value = line.removeprefix("export ").split("=", 1)
                  pins[key.strip()] = value.split(" #", 1)[0].strip().strip('"')
          tag = os.environ["TAG"]
          env = {
              "tag": tag,
              "commit": os.environ["GITHUB_SHA"],
              "workflow_run": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "runner": {"image": os.environ.get("ImageOS", ""), "image_version": os.environ.get("ImageVersion", ""),
                         "platform": os.environ["RUNNER_IMAGE"], "python": platform.python_version()},
              "pins": pins,
          }
          manifest = {
              "tag": tag,
              "artefacts": [
                  {"component": "source", "file": f"locksys-{tag}-src.tar.gz", "status": "included"},
                  {"component": "docs", "file": f"docs-{tag}.zip", "status": "included"},
                  {"component": "dcu", "file": f"locksys-dcu-{tag}.{{elf,hex,bin,map}}", "status": "pending"},
                  {"component": "cgw", "file": f"locksys-cgw-{tag}.{{bin,elf,map}}", "status": "pending"},
                  {"component": "app", "file": f"locksys-app-{tag}.apk", "status": "pending"},
                  {"component": "hil", "file": f"hil-report-{tag}.zip", "status": "pending"},
              ],
          }
          Path("dist/build-env.json").write_text(json.dumps(env, indent=2) + "\n", encoding="utf-8")
          Path("dist/release-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Load pins
        run: grep -E '^GIT_CLIFF=' tools/versions.env >> "$GITHUB_ENV"
      - name: Release notes (git-cliff)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          : "${GIT_CLIFF:?GIT_CLIFF missing in tools/versions.env}"
          # Changes since the previous final release; the first release covers the whole history.
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-rc.*' "${TAG}^" 2>/dev/null || true)
          range=()
          if [ -n "$previous" ]; then
            range=("${previous}..${TAG}")
          fi
          echo "Release notes since: ${previous:-start of history}"
          uvx --from "git-cliff==${GIT_CLIFF}" git-cliff --config cliff.toml --tag "$TAG" --strip header "${range[@]}" \
            > release-notes.md
          cat release-notes.md
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.ref_name }}
          path: |
            dist/
            release-notes.md
          retention-days: 30
          if-no-files-found: error

  publish:
    name: publish
    needs: [verify, assemble]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.ref_name }}
          path: ${{ runner.temp }}/release
      - name: Create the draft, upload the assets, publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          RELEASE_DIR: ${{ runner.temp }}/release
        run: |
          flags=(--draft --verify-tag --title "LockSys $VERSION" --notes-file "$RELEASE_DIR/release-notes.md")
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease)
          else
            flags+=(--latest)
          fi
          gh release create "$TAG" "${flags[@]}" "$RELEASE_DIR"/dist/*
          gh release edit "$TAG" --draft=false
          gh release view "$TAG" --json url --jq '"Published \(.url)"'
