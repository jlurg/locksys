#
# Ceedling 1.1.9 host unit tests of the CGW portable core (LS-CGW-SAD-001 section 14).
# Run: tools/docker/ceedling/run.sh firmware/cgw/test/host test:all   (coverage: gcov:all)
# CI: tools/ci/ceedling_ci.sh cgw firmware/cgw/test/host; thresholds in tools/ci/quality_gates.yaml
# (report-only until the M3 exit). Ports are replaced by the fakes in support/; the crypto port by
# a software HMAC-SHA256/HKDF implementation checked against interfaces/vectors/.
---
:project:
  :build_root: build
  :test_file_prefix: test_
  :use_mocks: FALSE
  :use_test_preprocessor: :none
  :use_backtrace: :none
  :default_tasks:
    - test:all

:paths:
  :test:
    - +:test/**
  :support:
    - support
  :source:
    - ../../components/cgw_arbiter/src
    - ../../components/cgw_com/src
    - ../../components/cgw_com/gen
    - ../../components/cgw_core/src
    - ../../components/cgw_health/src
    - ../../components/cgw_pairing/src
    - ../../components/cgw_proto/src
    - ../../components/cgw_proto/gen
    - ../../components/cgw_session/src
    - ../../components/cgw_vstate/src
    - ../../../../libs/ls_e2e/src
    - ../../../../libs/ls_common/src
    - ../../../../third_party/nanopb-0.4.9.2
  :include:
    - support
    - ../../components/cgw_ports/include/**
    - ../../components/cgw_arbiter/include/**
    - ../../components/cgw_com/include/**
    - ../../components/cgw_com/gen
    - ../../components/cgw_core/include/**
    - ../../components/cgw_core/src
    - ../../components/cgw_health/include/**
    - ../../components/cgw_pairing/include/**
    - ../../components/cgw_proto/include/**
    - ../../components/cgw_proto/gen
    - ../../components/cgw_session/include/**
    - ../../components/cgw_vstate/include/**
    - ../../../../libs/ls_e2e/include/**
    - ../../../../libs/ls_common/include/**
    - ../../../../libs/ls_common/gen
    - ../../../../third_party/nanopb-0.4.9.2

:defines:
  :test:
    - LS_HOST_TEST
    - PB_BUFFER_ONLY=1
    - PB_WITHOUT_64BIT=1
    - PB_MESSAGE_NESTING_MAX=4

# nanopb needs C11 (_Static_assert). Conversion warnings are part of the core warning set.
:flags:
  :test:
    :compile:
      :*:
        - -std=c11
        - -Wall
        - -Wextra
        - -Wconversion
        - -Wsign-conversion
        - -Wshadow
        - -Wstrict-prototypes
        - -Werror

:plugins:
  :enabled:
    - report_tests_pretty_stdout
    - gcov

# Coverage: gcovr JSON at build/artifacts/gcov/gcovr/GcovCoverage.json with paths relative to
# firmware/cgw (report_root), read by tools/ci/coverage_gate.py (component "cgw"). Libraries and
# third-party code lie outside the root; generated code and the tests are excluded.
:gcov:
  :summaries: TRUE
  :untested_sources: :compile
  :reports:
    - JSON
    - HtmlDetailed
  :gcovr:
    :report_root: "../.."
    :report_exclude:
      - ".*/test/.*"
      - ".*/gen/.*"
...
