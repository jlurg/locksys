#
# Parameter registry of LockSys: normative content of LS-SAIC-001 section 5.0.
#
# Rules (LS-SAIC-001 section 5.0):
# - Keys are unique lower_snake_case. The suffix gives the unit (_ms, _us, _ma, _mv, _dv, _cdeg,
#   _cdeg_s, _pct, _hz, _counts, _cps, _cpr, _mv_per_a, _bytes, _x1000, _level, _baud); the
#   prefix n_ marks a count; boolean keys have no suffix.
# - cal: true marks a bench-tuned value. In the MVP every value is a build-time constant.
# - min/max hold the calibration range or tolerance of the Range column.
# - lim_* keys are verification limits used by tests; they never configure product behaviour.
# - CAN cycle times, gaps, repetitions, E2E DataIDs, MaxDelta values and RX timeouts are defined
#   only in interfaces/can/locksys.dbc.
#
# Generated identifiers: C LS_<KEY> (libs/ls_common/gen/ls_params_gen.h), Python <KEY>
# (hil/src/locksys_hil/gen/params.py), Dart LsParams.<lowerCamelKey>.
# Regenerate with: uv run tools/codegen/regen.py

version: 1

groups:
  hold_to_run:
    title: Hold-to-run chain
    section: "5.0.1"
